<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Interaction Combinators — sandbox</title>
    <!--
      DEV-ONLY TOY. This page is not part of Number Go Up and is not built into
      the game bundle (see vite.config.ts — it is only added as a Rollup input
      when INET_SANDBOX=1). During `npm run dev` Vite serves any HTML file in the
      project root, so it lives at /sandbox.html with no configuration at all.

      The NET is drawn on the canvas (src/inet/render.ts, canvas-only, matching
      the game's visual language). The controls and metric readout are plain DOM
      because this is a dev tool and a legible HUD matters more here than
      matching the game's canvas-drawn chrome.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1026;
        --panel: rgba(18, 24, 54, 0.94);
        --stroke: rgba(120, 150, 255, 0.35);
        --text: #eaf0ff;
        --dim: rgba(234, 240, 255, 0.55);
        --accent: #7cf29b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Baloo 2", system-ui, -apple-system, sans-serif;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--stroke);
        font-size: 13px;
      }
      .group {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .group + .group::before {
        content: "";
        width: 1px;
        height: 20px;
        background: var(--stroke);
        margin-right: 6px;
      }
      button,
      select {
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: rgba(90, 110, 200, 0.18);
        border: 1px solid var(--stroke);
        border-radius: 7px;
        padding: 4px 9px;
        cursor: pointer;
      }
      button:hover,
      select:hover {
        background: rgba(120, 150, 255, 0.3);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.on {
        background: rgba(124, 242, 155, 0.22);
        border-color: var(--accent);
        color: var(--accent);
      }
      button.sym {
        font-size: 17px;
        min-width: 36px;
        line-height: 1.1;
      }
      button.sym[data-sym="γ"].on {
        background: rgba(124, 242, 155, 0.28);
        border-color: #7cf29b;
        color: #7cf29b;
      }
      button.sym[data-sym="δ"].on {
        background: rgba(255, 196, 107, 0.28);
        border-color: #ffc46b;
        color: #ffc46b;
      }
      button.sym[data-sym="ε"].on {
        background: rgba(255, 155, 224, 0.28);
        border-color: #ff9be0;
        color: #ff9be0;
      }
      label {
        color: var(--dim);
      }
      input[type="range"] {
        width: 92px;
        accent-color: var(--accent);
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 9px 12px;
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 10px;
        font-variant-numeric: tabular-nums;
        font-size: 12.5px;
        line-height: 1.55;
        pointer-events: none;
        min-width: 186px;
      }
      #hud b {
        float: right;
        margin-left: 14px;
        font-weight: 700;
      }
      #hud .k {
        color: var(--dim);
      }
      #hud hr {
        border: 0;
        border-top: 1px solid var(--stroke);
        margin: 5px 0;
      }
      #hud .state {
        color: var(--accent);
        font-weight: 700;
      }
      #hud .state.diverged {
        color: #ff6b8a;
      }
      #hint {
        position: absolute;
        bottom: 10px;
        left: 10px;
        right: 10px;
        color: var(--dim);
        font-size: 12px;
        pointer-events: none;
        text-align: center;
      }
      /* On a phone the HUD and the blurb would sit on top of each other, so the
         blurb moves down into the empty space below the net. */
      @media (max-width: 760px) {
        #hud {
          font-size: 10.5px;
          min-width: 126px;
          padding: 6px 8px;
          line-height: 1.4;
        }
        #desc {
          top: auto !important;
          bottom: 52px;
          left: 10px;
          max-width: none !important;
          font-size: 11.5px;
        }
      }
      /* Rule reference. Five alphabets is more than anyone can hold in their
         head, so the playground shows the table for whichever one is loaded. */
      #rulePanel {
        position: absolute;
        top: 10px;
        right: 10px;
        max-height: calc(100% - 20px);
        overflow: auto;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 10px;
        font-size: 12.5px;
        display: none;
        min-width: 240px;
      }
      #rulePanel.show {
        display: block;
      }
      #rulePanel h3 {
        font-size: 13px;
        margin-bottom: 6px;
      }
      #rulePanel table {
        border-collapse: collapse;
      }
      #rulePanel td {
        padding: 2px 8px 2px 0;
        white-space: nowrap;
      }
      #rulePanel .verb {
        color: var(--accent);
      }
      #rulePanel .dead {
        color: #ff6b8a;
      }
      #rulePanel .note {
        color: var(--dim);
        margin-top: 7px;
        white-space: normal;
        max-width: 260px;
      }
      #desc {
        position: absolute;
        top: 10px;
        right: 10px;
        max-width: 280px;
        padding: 9px 12px;
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 10px;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--dim);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="group">
          <select id="alphabet" title="Which symbols and rules this net is written in"></select>
          <button id="rules" title="Show the rule table">rules</button>
        </div>
        <div class="group">
          <select id="preset" title="Load a canned net"></select>
          <button id="random" title="Generate a random net in this alphabet">Random</button>
          <button id="reset" title="Rebuild the current preset">Reset</button>
          <button id="tidy" title="Re-run the tree layout">Tidy</button>
          <button id="clear" title="Empty the canvas">Clear</button>
        </div>
        <div class="group">
          <button id="step">Step</button>
          <button id="run">Run</button>
          <button id="pause" disabled>Pause</button>
        </div>
        <div class="group">
          <label for="speed">speed</label>
          <input id="speed" type="range" min="0" max="100" value="55" />
          <span id="speedLabel" class="k">4.0/s</span>
        </div>
        <div class="group">
          <button id="order" title="Fire one redex at a time, or a whole round at once">
            sequential
          </button>
          <button id="settle" title="Continuously settle positions and rotations between rewrites">
            settle
          </button>
        </div>
        <div class="group">
          <label for="cap">cap</label>
          <select id="cap" title="Pause a run when the net reaches this many agents">
            <option value="250">250</option>
            <option value="1000" selected>1000</option>
            <option value="4000">4000</option>
            <option value="0">∞</option>
          </select>
        </div>
        <div class="group">
          <label>place</label>
          <span id="palette"></span>
          <button id="erase" title="Delete agents">del</button>
        </div>
      </header>
      <main>
        <canvas id="net"></canvas>
        <div id="rulePanel"><div id="ruleBody"></div></div>
        <div id="hud"></div>
        <div id="desc"></div>
        <div id="hint"></div>
      </main>
    </div>
    <script type="module" src="/src/inet/sandbox.ts"></script>
  </body>
</html>
