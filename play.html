<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Clear the Net — interaction-combinator demo</title>
    <!--
      DEV-ONLY DEMO of the "each level is an enemy net, clear it to nothing"
      concept. Like sandbox.html this is served by `vite dev` straight out of the
      project root and is only built when INET_SANDBOX=1, so it never reaches the
      game bundle. Shares the whole engine with the sandbox; the only new layer
      is src/inet/level.ts + levels.ts + solver.ts.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1026;
        --panel: rgba(18, 24, 54, 0.94);
        --stroke: rgba(120, 150, 255, 0.35);
        --text: #eaf0ff;
        --dim: rgba(234, 240, 255, 0.55);
        --accent: #7cf29b;
        --gamma: #7cf29b;
        --delta: #ffc46b;
        --eps: #ff9be0;
        --wire: #8fb8ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: var(--bg); color: var(--text);
        font-family: "Baloo 2", system-ui, -apple-system, sans-serif;
        overflow: hidden; -webkit-user-select: none; user-select: none; }
      #app { display: flex; flex-direction: column; height: 100%; }
      header { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
        padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--stroke);
        font-size: 13px; }
      .group { display: flex; align-items: center; gap: 4px; }
      .group + .group::before { content: ""; width: 1px; height: 20px;
        background: var(--stroke); margin-right: 6px; }
      button, select { font: inherit; font-size: 13px; color: var(--text);
        background: rgba(90, 110, 200, 0.18); border: 1px solid var(--stroke);
        border-radius: 7px; padding: 4px 9px; cursor: pointer; }
      button:hover, select:hover { background: rgba(120, 150, 255, 0.3); }
      button:disabled { opacity: 0.4; cursor: default; }
      button.primary { background: rgba(124, 242, 155, 0.2); border-color: var(--accent); color: var(--accent); }
      main { position: relative; flex: 1; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
      #hud { position: absolute; top: 10px; left: 10px; padding: 9px 12px;
        background: var(--panel); border: 1px solid var(--stroke); border-radius: 10px;
        font-variant-numeric: tabular-nums; font-size: 12.5px; line-height: 1.55;
        pointer-events: none; min-width: 172px; }
      #hud b { float: right; margin-left: 14px; font-weight: 700; }
      #hud .k { color: var(--dim); }
      /* Rule reference: with several alphabets in play nobody can hold the
         tables in their head, and a puzzle you cannot read the rules of is not
         a puzzle. */
      #rulePanel { position: absolute; top: 10px; right: 10px; max-height: calc(100% - 20px);
        overflow: auto; padding: 10px 12px; background: var(--panel);
        border: 1px solid var(--stroke); border-radius: 10px; font-size: 12.5px;
        display: none; min-width: 230px; }
      #rulePanel.show { display: block; }
      #rulePanel h3 { font-size: 13px; margin-bottom: 6px; }
      #rulePanel table { border-collapse: collapse; }
      #rulePanel td { padding: 2px 8px 2px 0; white-space: nowrap; }
      #rulePanel .verb { color: var(--accent); }
      #rulePanel .dead { color: #ff6b8a; }
      #rulePanel .note { color: var(--dim); margin-top: 7px; white-space: normal; max-width: 250px; }
      #teaches { position: absolute; top: 10px; right: 10px; max-width: 300px;
        padding: 9px 12px; background: var(--panel); border: 1px solid var(--stroke);
        border-radius: 10px; font-size: 12.5px; line-height: 1.45; color: var(--dim);
        pointer-events: none; }
      #teaches b { color: var(--text); display: block; margin-bottom: 3px; font-size: 13.5px; }
      /* Hand */
      #hand { display: flex; gap: 8px; align-items: center; justify-content: center;
        padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--stroke);
        min-height: 76px; flex-wrap: wrap; }
      .card { width: 46px; height: 56px; border-radius: 9px; border: 2px solid var(--stroke);
        background: rgba(90, 110, 200, 0.16); font-size: 24px; line-height: 1;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
        transition: transform 0.09s ease, box-shadow 0.09s ease; }
      .card:hover { transform: translateY(-3px); }
      .card.sym-γ { color: var(--gamma); border-color: var(--gamma); }
      .card.sym-δ { color: var(--delta); border-color: var(--delta); }
      .card.sym-ε { color: var(--eps); border-color: var(--eps); }
      .card.sym-wire { color: var(--wire); border-color: var(--wire); }
      .card.on { transform: translateY(-8px); box-shadow: 0 0 0 2px currentColor, 0 6px 18px rgba(0,0,0,0.5); }
      .card.spent { opacity: 0.25; pointer-events: none; }
      #handHint { color: var(--dim); font-size: 12.5px; margin-left: 10px; }
      /* Result overlay */
      #result { position: absolute; inset: 0; display: none; align-items: center;
        justify-content: center; background: rgba(6, 9, 24, 0.72); }
      #result.show { display: flex; }
      #resultPanel { background: var(--panel); border: 1px solid var(--stroke);
        border-radius: 14px; padding: 22px 26px; text-align: center; min-width: 260px; }
      #resultPanel h2 { font-size: 22px; margin-bottom: 4px; }
      #resultPanel p { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
      #resultPanel .row { display: flex; gap: 8px; justify-content: center; }
      .win { color: var(--accent); }
      .lose { color: #ff6b8a; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="group">
          <select id="alphabet" title="Which symbols and rules to play with"></select>
          <button id="rules" title="Show the rule table">rules</button>
        </div>
        <div class="group">
          <select id="level" title="Pick a level"></select>
          <button id="reset">Reset</button>
          <button id="undo">Undo</button>
        </div>
        <div class="group">
          <button id="step">Step</button>
          <button id="run" class="primary">Run</button>
        </div>
        <div class="group">
          <span id="goal" class="k" style="color: var(--dim)">goal: reduce the net to nothing</span>
        </div>
      </header>
      <main>
        <canvas id="net"></canvas>
        <div id="hud"></div>
        <div id="teaches"></div>
        <div id="rulePanel"><div id="ruleBody"></div></div>
        <div id="result"><div id="resultPanel">
          <h2 id="resultTitle"></h2>
          <p id="resultBody"></p>
          <div class="row">
            <button id="resultAgain">Try again</button>
            <button id="resultNext" class="primary">Next level</button>
          </div>
        </div></div>
      </main>
      <div id="hand"></div>
    </div>
    <script type="module" src="/src/inet/play.ts"></script>
  </body>
</html>
